plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'
    - 'vendor/**/*' # gems installées par la CI (bundler-cache)

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 120
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false

# Le projet aligne les `=>` en colonnes (tables de libellés) : on accepte ce style
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: [key, table]
# Un hash ou un tableau sur plusieurs lignes compte pour une seule ligne
Metrics/MethodLength:
  CountAsOne: ['hash', 'array', 'heredoc']
Metrics/ClassLength:
  CountAsOne: ['hash', 'array', 'heredoc']
